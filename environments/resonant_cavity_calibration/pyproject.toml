[project]
name = "resonant-cavity-calibration"
version = "0.1.0"
description = "Deterministic evaluation of correlated calibration uncertainty in a synthetic cavity measurement."
requires-python = ">=3.11"
dependencies = ["datasets>=2.18", "verifiers>=0.1.11,<0.2"]
tags = ["physics", "uncertainty", "eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["resonant_cavity_calibration"]

[tool.verifiers.eval]
num_examples = 1
rollouts_per_example = 3
